[package]
name = "engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Local ONNX judge/ranker models (decision D2). Declared empty until the judge
# task wires it up; off by default so the base build needs no model runtime.
onnx = []

[dependencies]
rusqlite.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Test-only runtime surface: #[tokio::test], multi-threaded runs for the
# concurrency test. The production code needs only rt/time/sync.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
